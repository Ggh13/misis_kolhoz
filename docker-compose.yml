services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: misis_kolhoz-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build: ./frontend
    container_name: misis_kolhoz-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    networks:
      - app-network
    depends_on:
      - app
      - ml-service
      - marketing-agents

  app:
    build: ./backend
    container_name: misis_kolhoz-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./backend/config.yaml:/app/config.yaml:ro
    environment:
      - CONFIG_PATH=/app/config.yaml
    networks:
      - app-network
    depends_on:
      postgres:
        condition: service_healthy

  ml-service:
    build:
      context: .
      dockerfile: Dockerfile.ml
      args:
      - HF_TOKEN=${HF_TOKEN}
    container_name: misis_kolhoz-ml
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - HF_TOKEN=${HF_TOKEN}
      - GROQ_API_KEY=${GROQ_API_KEY}
    networks:
      - app-network

  marketing-agents:
    build:
      context: .
      dockerfile: Dockerfile.agents
    container_name: misis_kolhoz-agents
    restart: unless-stopped
    ports:
      - "8010:8010"
    environment:
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/mydb
      - GROQ_API_KEY=${GROQ_API_KEY}
      - HF_TOKEN=${HF_TOKEN}
      - PIXAZO_SUBSCRIPTION_KEY=${PIXAZO_SUBSCRIPTION_KEY}
    networks:
      - app-network
    depends_on:
      postgres:
        condition: service_healthy

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
