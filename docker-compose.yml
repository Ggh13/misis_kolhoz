services:
  postgres:
    image: postgres:15-alpine
    container_name: misis_kolhoz-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.17.0
    container_name: misis_kolhoz-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - app-network

  app:
    build: ./backend
    container_name: misis_kolhoz-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./backend/config.yaml:/app/config.yaml:ro
    environment:
      - CONFIG_PATH=/app/config.yaml
    networks:
      - app-network
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
  qdrant_data: