server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # API proxy — all known backend routes
    location /upload_data {
        proxy_pass http://app:8080;
    }
    location /upload_events {
        proxy_pass http://app:8080;
    }
    location /events {
        proxy_pass http://app:8080;
    }
    location /farmer_data {
        proxy_pass http://app:8080;
    }
    location /load_orders {
        proxy_pass http://app:8080;
    }
    location /clients {
        proxy_pass http://app:8080;
    }
    location /client_bonus {
        proxy_pass http://app:8080;
    }
    location /spend_bonus {
        proxy_pass http://app:8080;
    }
    location /recommendations {
        proxy_pass http://app:8080;
    }
    location /vector {
        proxy_pass http://app:8080;
    }
    location /health {
        proxy_pass http://app:8080;
    }

    location /ml/ {
        rewrite ^/ml/(.*)$ /$1 break;
        proxy_pass http://ml-service:8000;
    }

    location /agents {
        proxy_pass http://marketing-agents:8010;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
